<!doctype html>
<!-- Dichiara che il documento utilizza HTML5 -->
<html lang="en">
<!-- Elemento principale della pagina HTML
     lang="en" indica che la lingua del documento è impostata su inglese -->

<head>
  <!-- Definisce la codifica dei caratteri UTF-8
       per visualizzare correttamente lettere, accenti e simboli -->
  <meta charset="utf-8">

  <!-- Definisce il titolo della pagina visualizzato nella scheda del browser -->
  <title>AngularApi</title>

  <!-- Definisce il percorso di base utilizzato per gestire gli URL dell'applicazione
       "/" indica che l'applicazione parte dalla radice del dominio -->
  <base href="/">

  <!-- Configura la visualizzazione della pagina sui dispositivi mobili
       width=device-width adatta la larghezza allo schermo
       initial-scale=1 imposta lo zoom iniziale al 100% -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Specifica l'icona visualizzata nella scheda del browser (favicon) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <!-- Elemento root dell'applicazione Angular
       Angular utilizza questo tag per caricare il componente principale App -->
  <app-root></app-root>
</body>

</html>
